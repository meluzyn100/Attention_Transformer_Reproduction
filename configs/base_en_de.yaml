# ============================================================
# Base EN-DE configuration (Hydra)
# ============================================================

defaults:
  - train
  - _self_

# Reproduction hyperparameters (requested)
max_train_samples: 250000
max_steps: 100000

d_model: 512
n_layers: 6
heads: 8
d_ff: 2048
dropout: 0.1
label_smoothing: 0.1
batch_size_tokens: 25000
adam_beta2: 0.98
warmup_steps: 4000

# Approximate 25k-token effective batch on smaller hardware.
batch_tokens: 4096
accum_steps: 6

model:
  d_model: ${d_model}
  num_layers: ${n_layers}
  h: ${heads}
  d_ff: ${d_ff}
  dropout: ${dropout}
  activation_checkpointing: true
  activation_checkpointing_reentrant: false

optimizer:
  betas:
    - 0.9
    - ${adam_beta2}

scheduler:
  warmup_steps: ${warmup_steps}
  lr_scale: 1

training:
  use_amp: true
  amp_dtype: bf16
  label_smoothing: ${label_smoothing}
  max_steps: ${max_steps}
  accum_steps: ${accum_steps}
  checkpoint_dir: checkpoints/base_en_de_v1
  checkpoint_every_steps: 5000
  skip_backoff_trigger: 20
  skip_backoff_factor: 0.5
  max_skipped_steps_per_epoch: 500
  min_lr: 1.0e-6

distributed:
  enabled: false
data:
  # The current dataloader batches by examples; keep token counts for experiment tracking.
  batch_size_tokens: ${batch_size_tokens}
  batch_tokens: ${batch_tokens}
  max_train_samples: ${max_train_samples}