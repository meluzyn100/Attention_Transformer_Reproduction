# ============================================================
# Attention Is All You Need — training configuration (Hydra)
# ============================================================

defaults:
  - _self_

# ---- Model ------------------------------------------------
model:
  _target_: src.models.transformer.Transformer
  vocab_size: 37000
  d_model: 512
  num_layers: 6
  h: 8
  d_ff: 2048
  dropout: 0.1
  max_len: 512
  activation_checkpointing: false
  activation_checkpointing_reentrant: false
  

# ---- Data -------------------------------------------------
data:
  train_jsonl: data/raw/wmt14_de_en/train.jsonl
  val_jsonl: data/raw/wmt14_de_en/validation.jsonl
  tokenizer_vocab: data/processed/bpe/bpe_vocab.json
  tokenizer_merges: data/processed/bpe/bpe_merges.txt
  batch_size: 16
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  multiprocessing_context: spawn
  prefetch_factor: 2
  # Optional: limit training set size (null = use all data)
  max_train_samples: null

# ---- Optimizer --------------------------------------------
optimizer:
  _target_: torch.optim.Adam
  lr: 1.0          # overridden by Noam scheduler in practice
  betas: [0.9, 0.98]
  eps: 1.0e-9

# ---- Noam LR Scheduler ------------------------------------
scheduler:
  use_noam: true
  d_model: ${model.d_model}   # interpolated from model section
  warmup_steps: 4000
  lr_scale: 1

# ---- Training loop ----------------------------------------
training:
  epochs: 15
  max_steps: 100000             # optional override to set max steps instead of epochs
  label_smoothing: 0.1
  ignore_index: 0              # PAD_ID
  device: cuda                 # or "cpu"
  use_amp: true
  amp_dtype: auto              # auto|bf16|fp16
  grad_clip_norm: 0.5
  max_skipped_steps_per_epoch: 1000
  skip_backoff_trigger: 1000
  skip_backoff_factor: 0.5
  min_lr: 1.0e-6
  checkpoint_dir: checkpoints
  resume_from: null            # explicit checkpoint path; if null and auto_resume_latest=true, latest *.pt is used
  auto_resume_latest: true
  resume_strict: false         # if true, fail on incompatible checkpoint; if false, start from scratch
  log_every: 500                # print every N optimizer steps
  validate_every: 1            # validate every N epochs
  save_every: 1                # save checkpoint every N epochs
  gpu_monitoring: true
  seed: 42

# ---- Distributed ------------------------------------------
distributed:
  enabled: false
  backend: nccl             # or "gloo" for CPU-only (not recommended for performance reasons)
  timeout_minutes: 30

# ---- MLflow -----------------------------------------------
mlflow:
  enabled: true
  base_dir: runs/mlflow
  tracking_uri: null          # defaults to local sqlite in ${mlflow.base_dir}
  experiment_name: attention_transformer
  run_name: null
  log_checkpoints: false      # avoid duplicate checkpoint files in both checkpoints/ and runs/mlflow/artifacts/
  tags: {}

# ---- Smoke test -------------------------------------------
# Use `python train.py --config-name smoke` for the isolated smoke config.
smoke:
  enabled: false
  steps: 50                             # gradient steps overfitting 1 batch
  checkpoint_path: checkpoints/smoke.pt
