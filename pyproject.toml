[project]
name = "attention-transformer-reproduction"
version = "0.1.0"
description = "Reproduction of an attention transformer model"
readme = "README.md"
authors = [ { name = "Aleksander Jakóbyczk", email = "aleksander.jakobczyk@gmail.com" } ]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
	"numpy>=2.0",
	"torch>=2.1",
	"tqdm>=4.0",
	"hydra-core>=1.3",
	"datasets>=4.0",
	"tokenizers>=0.22",
	"mlflow>=3.0"
]

[project.optional-dependencies]
dev = [
	"pytest>=7.0",
	"ruff>=0.15.15",
	"black>=23.9",
	"pre-commit>=2.0"
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["build", "dist", ".venv", "__pycache__", ".git"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
